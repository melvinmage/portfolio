<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>☎️ R2.04 - Expert Téléphonie</title>
    <style>
        :root {
            --brand-color: #E65100;
            --brand-light: #FF9800;
            --bg-color: #ECEFF1;
            --phone-body: #263238;
            --screen-bg: #F4F7F6;
            --text-dark: #212121;
            --btn-green: #4CAF50;
            --btn-red: #F44336;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }

        body {
            background: linear-gradient(135deg, #ECEFF1 0%, #B0BEC5 100%);
            color: var(--text-dark);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            min-height: 100vh; padding: 40px 20px;
        }

        .header { text-align: center; margin-bottom: 40px; }
        .header h1 { color: var(--phone-body); font-size: 3rem; text-shadow: 2px 2px 4px rgba(0,0,0,0.1); }
        .header h1 span { color: var(--brand-color); }
        .header p { color: #455A64; font-size: 1.2rem; font-weight: bold; margin-top: 10px; }

        .phone-container {
            background-color: var(--phone-body); width: 100%; max-width: 1000px; 
            border-radius: 30px; padding: 30px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.4), inset 0 2px 5px rgba(255,255,255,0.1);
        }

        .phone-screen {
            background-color: var(--screen-bg); border: 6px solid #1c262b; border-radius: 15px; padding: 30px;
            min-height: 500px; box-shadow: inset 0 0 30px rgba(0,0,0,0.05); position: relative; overflow: hidden;
            display: flex; flex-direction: column;
        }

        .view { display: none; z-index: 1; position: relative; flex: 1; }
        .view.active { display: flex; flex-direction: column; animation: turnOn 0.4s ease; }

        @keyframes turnOn { from { opacity: 0; transform: scale(0.98); } to { opacity: 1; transform: scale(1); } }

        .nav-buttons { display: flex; justify-content: center; gap: 20px; margin-top: 30px; }
        .nav-btn {
            background-color: #37474F; color: white; border: 2px solid #1c262b; padding: 15px 40px; 
            border-radius: 12px; font-size: 1.2rem; font-weight: bold; cursor: pointer; 
            box-shadow: 0 6px 0 #1c262b; transition: all 0.1s;
        }
        .nav-btn:active { transform: translateY(6px); box-shadow: 0 0 0 #1c262b; }
        .nav-btn.active-mode { background-color: var(--brand-color); }

        /* -- VUE FLASHCARDS -- */
        .status-bar { 
            display: flex; justify-content: space-between; background: #CFD8DC; padding: 10px 20px; 
            border-radius: 8px; font-weight: bold; font-size: 1.1rem; color: #37474F; margin-bottom: 20px; 
        }
        .flashcard-wrapper { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
        
        .card-clickable {
            background: white; border: 3px dashed #B0BEC5; border-radius: 20px; padding: 40px; width: 100%; max-width: 800px;
            cursor: pointer; transition: all 0.2s ease; box-shadow: 0 10px 20px rgba(0,0,0,0.05);
            display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 250px;
        }
        .card-clickable:hover { border-color: var(--brand-color); transform: translateY(-5px); box-shadow: 0 15px 30px rgba(230,81,0,0.15); }
        
        .hint-text { color: #90A4AE; font-size: 1.1rem; margin-bottom: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px;}
        .acronym-display { font-size: 4.5rem; font-weight: 900; color: var(--brand-color); margin: 0; text-shadow: 1px 1px 0px rgba(0,0,0,0.1); }
        
        .definition-display { 
            font-size: 1.6rem; color: var(--text-dark); background: #FFF3E0; padding: 25px; 
            border-radius: 12px; margin-top: 25px; display: none; border-left: 8px solid var(--brand-color); 
            line-height: 1.5; font-weight: 500; width: 100%; max-width: 800px; animation: slideDown 0.3s ease-out;
        }

        @keyframes slideDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
        
        .controls { display: flex; justify-content: center; gap: 15px; margin-top: 40px; }
        .controls button { padding: 15px 30px; font-size: 1.2rem; border: none; border-radius: 10px; background: #607D8B; color: white; cursor: pointer; font-weight: bold; transition: all 0.2s; box-shadow: 0 4px 6px rgba(0,0,0,0.1);}
        .controls button:hover { background: #455A64; transform: scale(1.05); }

        /* -- VUE QUIZ -- */
        .blink { animation: blinker 1.5s linear infinite; color: var(--btn-red); }
        @keyframes blinker { 50% { opacity: 0; } }
        .question-text { text-align: center; font-size: 1.4rem; margin-bottom: 10px; color: #546E7A; font-weight: bold;}
        .quiz-acronym { text-align: center; font-size: 3.5rem; font-weight: 900; color: var(--brand-color); margin-bottom: 30px; }
        .answers-grid { display: grid; grid-template-columns: 1fr; gap: 12px; width: 100%; max-width: 800px; margin: 0 auto;}
        .answer-btn { background: white; border: 3px solid #CFD8DC; padding: 20px; border-radius: 12px; font-size: 1.2rem; cursor: pointer; text-align: left; transition: all 0.2s; font-weight: 600; color: #37474F; box-shadow: 0 4px 6px rgba(0,0,0,0.05);}
        .answer-btn:hover:not(:disabled) { border-color: var(--brand-color); background: #FFF3E0; transform: translateX(5px);}
        .answer-btn.correct { background: var(--btn-green); color: white; border-color: #2E7D32; }
        .answer-btn.wrong { background: var(--btn-red); color: white; border-color: #C62828; }

        /* -- RESULTATS -- */
        .results-view { text-align: center; padding-top: 20px; flex: 1; display: flex; flex-direction: column; justify-content: center;}
        .score-circle { width: 150px; height: 150px; border-radius: 50%; background: var(--phone-body); color: white; display: flex; align-items: center; justify-content: center; font-size: 3rem; font-weight: 900; margin: 0 auto 20px; border: 8px solid var(--brand-color); box-shadow: 0 10px 20px rgba(0,0,0,0.2);}
        .call-btn { background: var(--btn-green); color: white; border: none; padding: 20px 40px; border-radius: 50px; font-size: 1.5rem; font-weight: bold; cursor: pointer; box-shadow: 0 8px 20px rgba(76, 175, 80, 0.4); margin: 30px auto 0; transition: transform 0.2s;}
        .call-btn:hover { background: #43A047; transform: scale(1.05);}
    </style>
</head>
<body>

    <div class="header">
        <h1>☎️ R2.04 - Expert <span>Téléphonie</span></h1>
        <p>Plus de 60 concepts tirés des 26 pages du cours de M. Toussaint</p>
    </div>

    <div class="phone-container">
        <div class="phone-screen">
            
            <div id="view-flashcards" class="view active">
                <div class="status-bar">
                    <span>📞 Répertoire Expert</span>
                    <span id="fc-counter">Fiche 0/0</span>
                </div>
                <div class="flashcard-wrapper">
                    
                    <div class="card-clickable" onclick="toggleDef()">
                        <div class="hint-text" id="hint-msg">👉 Appuie ici pour révéler la définition 👈</div>
                        <div class="acronym-display" id="fc-acronym">---</div>
                    </div>

                    <div class="definition-display" id="fc-def">---</div>
                    
                </div>
                <div class="controls">
                    <button onclick="prevCard()">◄ Précédent</button>
                    <button onclick="shuffleAndLoadCards()" style="background:var(--brand-color)">🔀 Mélanger tout</button>
                    <button onclick="nextCard()">Suivant ►</button>
                </div>
            </div>

            <div id="view-quiz" class="view">
                <div class="status-bar">
                    <span class="blink">🔴 Evaluation en cours...</span>
                    <span id="quiz-progress">Q: 1/15</span>
                </div>
                <div class="question-text">Identifie la définition de :</div>
                <div class="quiz-acronym" id="q-acronym">---</div>
                <div class="answers-grid" id="q-answers"></div>
            </div>

            <div id="view-results" class="view">
                <div class="status-bar">
                    <span>❌ Communication terminée</span>
                </div>
                <div class="results-view">
                    <h2 style="color: var(--phone-body); margin-bottom:20px; font-size: 2rem;">Rapport de QoS</h2>
                    <div class="score-circle" id="final-score">0/15</div>
                    <h3 id="feedback-msg" style="font-size: 1.5rem; color: #455A64; margin-top: 10px;">---</h3>
                    <button class="call-btn" onclick="setMode('quiz')">📞 Relancer un appel (Test)</button>
                </div>
            </div>

        </div>

        <div class="nav-buttons">
            <button class="nav-btn active-mode" id="btn-mode-flash" onclick="setMode('flashcards')">📇 Flashcards</button>
            <button class="nav-btn" id="btn-mode-quiz" onclick="setMode('quiz')">🟩 Lancer le Quiz</button>
        </div>
    </div>

    <script>
        // LA BASE DE DONNÉES EXPERTE
        const database = [
            { a: "Full-duplex", d: "Mode de communication dans les deux sens en même temps (typique de la téléphonie)." },
            { a: "Half-duplex", d: "Communication dans un sens puis l'autre, pas en même temps (ex: talkie-walkie)." },
            { a: "Signalisation", d: "Ensemble des messages échangés sur le réseau pour mettre en œuvre un service (décrocher, numéroter, faire sonner)." },
            { a: "RTC", d: "Réseau Téléphonique Commuté. Le réseau analogique historique (en cours de démantèlement, fin prévue 2030)." },
            { a: "URA", d: "Unité de Raccordement d'Abonnés. Équipement du réseau historique opérateur." },
            { a: "Répartiteur", d: "Salle historique chez l'opérateur (Orange) où arrivent toutes les lignes de cuivre des abonnés." },
            { a: "DSLAM", d: "Multiplexeur d'accès DSL. Équipement opérateur pour grouper le trafic internet ADSL." },
            { a: "DTMF (Q23)", d: "Dual-Tone Multi-Frequency. Envoi de combinaisons de 2 fréquences à partir du commutateur pour envoyer le numéro appelé." },
            { a: "Bande 300-3400 Hz", d: "La bande de fréquences utilisée pour transmettre la voix humaine en téléphonie analogique classique." },
            { a: "RNIS", d: "Réseau Numérique à Intégration de Services (ex: Numéris). Remplaçant de l'analogique avant la VoIP." },
            { a: "Accès T0 (BRI)", d: "Accès de base RNIS : comprend 2 canaux B à 64kbps (voix) + 1 canal D à 16kbps (signalisation)." },
            { a: "Accès T2 (PRI)", d: "Accès primaire RNIS : comprend 30 canaux B (pour la voix) + 1 canal D (pour la signalisation)." },
            { a: "Canal D", d: "Le canal du réseau RNIS réservé exclusivement au transport de la signalisation (messages Q931)." },
            { a: "Q.931", d: "Protocole de signalisation utilisé sur le canal D du réseau RNIS." },
            { a: "SETUP", d: "Message Q.931 envoyé pour demander l'établissement d'un appel RNIS." },
            { a: "CONNECT", d: "Message Q.931 indiquant que l'appelé a décroché et que la conversation commence." },
            { a: "PABX", d: "Private Automatic Branch eXchange. L'autocommutateur traditionnel (analogique/numérique) d'une entreprise." },
            { a: "IPBX", d: "PABX moderne organisé autour d'un Serveur d'appel, gérant la téléphonie sur réseau IP." },
            { a: "Centrex IP", d: "Solution où l'IPBX (le serveur d'appel) n'est pas dans l'entreprise mais déporté dans le cloud chez l'opérateur ITSP." },
            { a: "Hardphone", d: "Téléphone IP physique posé sur le bureau." },
            { a: "Softphone", d: "Logiciel de téléphonie installé sur PC, nécessitant casque et micro (possède souvent la fonction click2call)." },
            { a: "POPC", d: "Poste Opérateur PC. L'outil informatique du standardiste." },
            { a: "DECT", d: "Norme de la téléphonie sans fil. Dans une entreprise, les combinés DECT se connectent à des bornes raccordées au LAN." },
            { a: "SDA / DID", d: "Sélection Directe à l'Arrivée (Direct Inward Dialling). Permet d'appeler directement un poste interne sans passer par l'accueil." },
            { a: "SVI", d: "Serveur Vocal Interactif. Répond avec des menus vocaux navigués via les touches DTMF ('Tapez 1...')." },
            { a: "ACD", d: "Distribution Automatique d'Appel. Oriente l'appel entrant vers un groupe selon la compétence ou disponibilité." },
            { a: "PoE (802.3af)", d: "Power over Ethernet. Norme permettant au Switch d'alimenter électriquement le téléphone IP via le câble RJ45." },
            { a: "LAN", d: "Le réseau local de l'entreprise où sont branchés les PC et les téléphones IP." },
            { a: "VLAN", d: "Réseau virtuel. On sépare souvent les PC et les téléphones sur deux VLANs distincts pour la sécurité et la QoS." },
            { a: "DHCP", d: "Protocole qui attribue automatiquement une adresse IP au téléphone fixe quand il démarre." },
            { a: "FTP / TFTP", d: "Protocoles utilisés par le téléphone IP pour récupérer sa configuration ou mettre à jour son Firmware au démarrage." },
            { a: "ARCEP", d: "L'autorité française de régulation qui gère le plan de numérotation national." },
            { a: "E.164", d: "Recommandation de l'UIT-T décrivant la façon d'attribuer les numéros de téléphone internationaux." },
            { a: "ZABPQ", d: "Format du plan de numérotation français à 10 chiffres (Z = zone géo, A/B = commutateur, P/Q = équipement)." },
            { a: "ToIP", d: "Telephony over IP. L'infrastructure complète (matériel + réseau) pour faire de la téléphonie sur IP en entreprise." },
            { a: "VoIP", d: "La technique de production et de transport de paquets contenant la voix numérisée." },
            { a: "Codec", d: "Codeur/Décodeur. Algorithme qui numérise et compresse la voix. Ex: G.711, G.722, G.729, Opus." },
            { a: "G.711", d: "Codec très courant (alaw ou ulaw) échantillonnant la voix à 8kHz, nécessitant environ 64 kbps de bande passante." },
            { a: "Paquet de voix", d: "En ToIP, on regroupe généralement 20 ms d'échantillons de voix dans un seul paquet IP." },
            { a: "Silence Suppression", d: "Technique réseau permettant de ne rien émettre si personne ne parle, pour économiser la bande passante." },
            { a: "RTP", d: "Realtime Transport Protocol. Le protocole (généralement sur UDP) qui transporte effectivement les paquets de voix." },
            { a: "RTCP", d: "Realtime Transport Control Protocol. Contrôle le flux RTP en remontant l'état de la transmission (pertes, gigue)." },
            { a: "SRTP", d: "Secure RTP. Chiffre le flux de la voix pour empêcher l'écoute pirate (replay)." },
            { a: "QoS", d: "Quality of Service. Règles configurées sur les switchs/routeurs pour prioriser les paquets Voix par rapport aux Data." },
            { a: "Latence", d: "Temps entre l'émission de la voix et sa réception. Doit être inférieur à 150 ms." },
            { a: "Gigue (Jitter)", d: "La variation de la latence entre les différents paquets. Doit être inférieure à 40 ms." },
            { a: "802.1p/q", d: "Normes permettant de marquer les trames Ethernet au niveau 2 (Switch) pour appliquer la QoS." },
            { a: "DiffServ", d: "Mécanisme de QoS au niveau 3 (Routeur) modifiant le champ DSCP de l'en-tête du paquet IP." },
            { a: "SIP", d: "Session Initiation Protocol. Le protocole de signalisation star (RFC 3261 par l'IETF) pour établir/gérer les appels." },
            { a: "H.323", d: "L'ancêtre de SIP. Protocole de signalisation historique de la ToIP, quasiment disparu aujourd'hui." },
            { a: "ITSP", d: "Internet Telephony Service Provider (ex: OVH, Orange). Fournisseur de liens Trunk SIP pour sortir vers l'extérieur." },
            { a: "Trunk SIP", d: "La liaison 'virtuelle' entre l'IPBX de l'entreprise et l'opérateur (ITSP) via Internet." },
            { a: "AOR", d: "Address Of Record. Identifiant SIP d'un usager, format type e-mail (ex: sip:jean@domaine.fr)." },
            { a: "Proxy SIP", d: "Entité du serveur SIP qui retransmet les requêtes vers le bon interlocuteur." },
            { a: "Registrar", d: "Serveur SIP où le téléphone vient enregistrer son adresse IP actuelle pour qu'on puisse le retrouver." },
            { a: "Serveur de localisation", d: "Base de données stockant les localisations (adresses IP) des téléphones, alimentée par le Registrar." },
            { a: "INVITE", d: "Requête SIP. Demande d'établissement d'appel (C'est le début d'un dialogue)." },
            { a: "REGISTER", d: "Requête SIP. Demande d'enregistrement d'un téléphone auprès du serveur Registrar." },
            { a: "ACK", d: "Requête SIP. Confirme obligatoirement la bonne réception d'une réponse finale (comme un 200 OK)." },
            { a: "BYE", d: "Requête SIP. Termine un appel (correspond au raccrochage)." },
            { a: "100 Trying", d: "Réponse SIP (Provisoire). Indique que le serveur a bien reçu l'INVITE et le traite." },
            { a: "180 Ringing", d: "Réponse SIP (Provisoire). Indique que le téléphone de destination est en train de sonner." },
            { a: "200 OK", d: "Réponse SIP (Positive). Indique le succès de la requête (La personne a décroché, ou le REGISTER a marché)." },
            { a: "401 Unauthorized", d: "Réponse SIP (Erreur). Le serveur refuse l'action et demande à l'usager de s'authentifier (login/mdp)." }
        ];

        // --- FONCTION DE MÉLANGE ROBUSTE ---
        function shuffleArray(array) {
            let arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        // --- MOTEUR FLASHCARDS ---
        let cardIndex = 0;
        let isDefVisible = false;

        function loadCard() {
            isDefVisible = false;
            document.getElementById('fc-def').style.display = 'none';
            document.getElementById('hint-msg').style.display = 'block';
            document.getElementById('fc-acronym').innerText = database[cardIndex].a;
            document.getElementById('fc-def').innerText = database[cardIndex].d;
            document.getElementById('fc-counter').innerText = `Fiche ${cardIndex + 1}/${database.length}`;
        }

        function toggleDef() {
            isDefVisible = !isDefVisible;
            if (isDefVisible) {
                document.getElementById('fc-def').style.display = 'block';
                document.getElementById('hint-msg').style.display = 'none';
            } else {
                document.getElementById('fc-def').style.display = 'none';
                document.getElementById('hint-msg').style.display = 'block';
            }
        }

        function nextCard() { cardIndex = (cardIndex + 1) % database.length; loadCard(); }
        function prevCard() { cardIndex = (cardIndex - 1 + database.length) % database.length; loadCard(); }
        
        function shuffleAndLoadCards() {
            for (let i = database.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [database[i], database[j]] = [database[j], database[i]];
            }
            cardIndex = 0;
            loadCard();
        }

        // --- MOTEUR QUIZ ---
        const Q_MAX = 15;
        let qIndex = 0;
        let score = 0;
        let currentQuiz = [];
        let canClick = true;

        function initQuiz() {
            let dbShuffled = [...database];
            for (let i = dbShuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [dbShuffled[i], dbShuffled[j]] = [dbShuffled[j], dbShuffled[i]];
            }
            
            currentQuiz = dbShuffled.slice(0, Q_MAX);
            qIndex = 0;
            score = 0;
            loadQuestion();
        }

        function loadQuestion() {
            canClick = true;
            document.getElementById('quiz-progress').innerText = `Q: ${qIndex + 1}/${Q_MAX}`;
            const q = currentQuiz[qIndex];
            document.getElementById('q-acronym').innerText = q.a;

            let choices = [q.d];
            let wrongOptions = [];
            let safetyCounter = 0;
            
            while(wrongOptions.length < 3 && safetyCounter < 1000) {
                let randomIndex = Math.floor(Math.random() * database.length);
                let candidateDef = database[randomIndex].d;
                if(candidateDef !== q.d && !wrongOptions.includes(candidateDef)) {
                    wrongOptions.push(candidateDef);
                }
                safetyCounter++;
            }
            
            choices = choices.concat(wrongOptions);

            for (let i = choices.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [choices[i], choices[j]] = [choices[j], choices[i]];
            }

            const grid = document.getElementById('q-answers');
            grid.innerHTML = '';
            
            choices.forEach(choice => {
                let btn = document.createElement('button');
                btn.className = 'answer-btn';
                btn.innerText = choice;
                btn.onclick = () => handleAnswer(btn, choice === q.d);
                grid.appendChild(btn);
            });
        }

        function handleAnswer(btn, isCorrect) {
            if(!canClick) return;
            canClick = false;

            let allBtns = document.querySelectorAll('.answer-btn');
            allBtns.forEach(b => b.disabled = true);

            if(isCorrect) {
                btn.classList.add('correct');
                score++;
            } else {
                btn.classList.add('wrong');
                allBtns.forEach(b => {
                    if(b.innerText === currentQuiz[qIndex].d) b.classList.add('correct');
                });
            }

            setTimeout(() => {
                qIndex++;
                if(qIndex < Q_MAX) loadQuestion();
                else endQuiz();
            }, 1800); 
        }

        function endQuiz() {
            setMode('results');
            document.getElementById('final-score').innerText = `${score}/${Q_MAX}`;
            
            let msg = "";
            if(score === Q_MAX) msg = "100% de paquets reçus. Masterclass SIP ! 🏆";
            else if(score >= 12) msg = "Excellent niveau. Tu es prêt pour l'exam R2.04. 👍";
            else if(score >= 8) msg = "Un peu de gigue... Fais encore quelques flashcards ! 📻";
            else msg = "Erreur 401 Unauthorized. Il faut réviser le cours ! ✂️";
            
            document.getElementById('feedback-msg').innerText = msg;
        }

        // --- NAVIGATION ---
        function setMode(mode) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active-mode'));

            if(mode === 'flashcards') {
                document.getElementById('view-flashcards').classList.add('active');
                document.getElementById('btn-mode-flash').classList.add('active-mode');
                loadCard();
            } else if (mode === 'quiz') {
                document.getElementById('view-quiz').classList.add('active');
                document.getElementById('btn-mode-quiz').classList.add('active-mode');
                initQuiz();
            } else if (mode === 'results') {
                document.getElementById('view-results').classList.add('active');
            }
        }

        // --- SUPPORT CLAVIER ---
        document.addEventListener('keydown', (e) => {
            if (document.getElementById('view-flashcards').classList.contains('active')) {
                if (e.key === 'ArrowRight') nextCard();
                if (e.key === 'ArrowLeft') prevCard();
                if (e.key === ' ' || e.key === 'Enter') {
                    e.preventDefault();
                    toggleDef();
                }
            }
        });

        loadCard();

    </script>
</body>
</html>
